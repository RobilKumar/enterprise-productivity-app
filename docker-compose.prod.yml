# ============================================================
# Enterprise Productivity App — PRODUCTION (Hostinger VPS)
# Usage:  docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ── NGINX Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ep_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - admin
    restart: always
    networks: [ep_net]

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ep_backend
    env_file: .env.production
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      DB_HOST: sqlserver
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./logs:/var/log/productivity-app
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: always
    networks: [ep_net]
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout:  10s
      retries:  3
    # No external port exposure — nginx proxies to backend internally

  # ── Admin Dashboard ───────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: ep_admin
    restart: always
    networks: [ep_net]
    # No external port — nginx serves it

  # ── SQL Server 2022 Express ───────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ep_sqlserver
    environment:
      SA_PASSWORD:           "${DB_PASSWORD}"
      ACCEPT_EULA:           "Y"
      MSSQL_PID:             "Express"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: always
    networks: [ep_net]
    # No external port — only backend connects to it internally
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -Q 'SELECT 1' -No -C 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -Q 'SELECT 1' 2>/dev/null) && echo OK"]
      interval: 15s
      timeout:  10s
      retries:  15
      start_period: 90s

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ep_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    networks: [ep_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout:  5s
      retries:  5

  # ── MinIO Object Storage ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ep_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    restart: always
    networks: [ep_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Certbot (auto SSL renewal) ────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: ep_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    restart: always
    networks: [ep_net]

volumes:
  sqlserver_data:
  redis_data:
  minio_data:
  nginx_logs:

networks:
  ep_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
