worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events { worker_connections 4096; multi_accept on; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Security Headers ───────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"           always;
    add_header X-XSS-Protection        "1; mode=block"        always;
    add_header X-Content-Type-Options  "nosniff"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── Rate Limiting ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=10r/m;

    # ── Upstream Backends ─────────────────────────────────────
    upstream backend_servers {
        least_conn;
        server backend:5000 max_fails=3 fail_timeout=30s;
        # Add more instances for horizontal scaling:
        # server backend2:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin_server {
        server admin:80;
        keepalive 8;
    }

    # ── HTTP server — API passthrough (no redirect) for mobile ──
    # /api/ and /socket.io/ are proxied directly so the Android
    # Capacitor app can reach the backend without HTTPS.
    # All other HTTP paths redirect to HTTPS as before.
    server {
        listen 80;
        server_name _;

        client_max_body_size 60M;

        # API — proxy to backend over plain HTTP (for mobile app)
        # Backend handles CORS itself; we just pass the request through.
        location /api/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto http;
            proxy_read_timeout 300s;
        }

        # Socket.IO — also pass through over HTTP for mobile real-time
        location /socket.io/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Health check
        location /health {
            proxy_pass http://backend_servers;
        }

        # Everything else → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS Server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 60M;

        # ── Admin Dashboard ──────────────────────────────────
        location / {
            proxy_pass         http://admin_server;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 1d;

            # SPA fallback
            try_files $uri $uri/ @admin;
        }
        location @admin {
            proxy_pass http://admin_server;
        }

        # ── API (rate limited) ───────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # ── Auth endpoints (stricter limit) ─────────────────
        location /api/v1/auth/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend_servers;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── File Upload ──────────────────────────────────────
        location /api/v1/tasks/*/attachments {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 55M;
            proxy_pass http://backend_servers;
            proxy_read_timeout 120s;
        }

        # ── Socket.IO ────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── API Docs ─────────────────────────────────────────
        location /api-docs {
            proxy_pass http://backend_servers;
        }

        # ── Metrics (internal only) ──────────────────────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend_servers;
        }

        # ── Health Check ─────────────────────────────────────
        location /health {
            access_log off;
            proxy_pass http://backend_servers;
        }
    }
}
