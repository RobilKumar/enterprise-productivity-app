# ============================================================
# Enterprise Productivity App — Docker Compose
# All services: backend, admin, sqlserver, redis, minio,
#               prometheus, grafana, nginx
# ============================================================

services:

  # ── NGINX Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ep_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - admin
    restart: always
    networks: [ep_net]

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ep_backend
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./logs:/var/log/productivity-app
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: always
    networks: [ep_net]
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Admin Dashboard ───────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: ep_admin
    environment:
      REACT_APP_API_URL: /api/v1
    ports:
      - "3000:80"
    restart: always
    networks: [ep_net]

  # ── SQL Server 2022 ───────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ep_sqlserver
    environment:
      SA_PASSWORD:           "YourStrong@Password123"
      ACCEPT_EULA:           "Y"
      MSSQL_PID:             "Express"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: always
    networks: [ep_net]
    healthcheck:
      # Try tools18 path first (SQL Server 2022), fall back to tools path (older)
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' -No -C 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' 2>/dev/null) && echo OK"]
      interval: 15s
      timeout:  10s
      retries:  15
      start_period: 90s

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ep_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-YourRedisPassword123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks: [ep_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YourRedisPassword123}", "ping"]
      interval: 15s
      timeout:  5s
      retries:  5

  # ── MinIO Object Storage ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ep_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always
    networks: [ep_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ep_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: always
    networks: [ep_net]

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ep_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaAdmin123}
      GF_INSTALL_PLUGINS:         grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scripts/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on: [prometheus]
    restart: always
    networks: [ep_net]

# ── Volumes ───────────────────────────────────────────────────
volumes:
  sqlserver_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

# ── Network ───────────────────────────────────────────────────
networks:
  ep_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
