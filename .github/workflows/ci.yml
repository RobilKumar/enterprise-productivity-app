name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  # ─── Backend Tests ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: TestPass@123
          ACCEPT_EULA: Y
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPass@123 -Q 'SELECT 1'"
          --health-interval 30s --health-timeout 10s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=TestDB;user=sa;password=TestPass@123;encrypt=DANGER_PLAINTEXT"

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=TestDB;user=sa;password=TestPass@123;encrypt=DANGER_PLAINTEXT"
        continue-on-error: true

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm test -- --passWithNoTests --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: "sqlserver://localhost:1433;database=TestDB;user=sa;password=TestPass@123;encrypt=DANGER_PLAINTEXT"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-minimum-32-characters
          JWT_REFRESH_SECRET: test-refresh-secret-key-minimum-32-chars

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage
        continue-on-error: true

  # ─── Admin Dashboard Build ─────────────────────────────────
  admin-build:
    name: Admin Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ─── Docker Build & Push ───────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, admin-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─── Deploy to Production ─────────────────────────────────
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/productivity-app
            git pull origin main
            docker compose pull backend admin
            docker compose up -d --no-deps backend admin
            docker compose exec -T backend npx prisma migrate deploy
            docker system prune -f
            echo "Deployment complete at $(date)"
